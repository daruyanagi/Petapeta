name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build x64
        run: >
          dotnet publish Petapeta.csproj
          -c Release -r win-x64 -p:Platform=x64 -p:EffectivePlatform=x64
          -p:WindowsPackageType=None -p:SelfContained=true
          -o publish/x64

      - name: Build arm64
        run: >
          dotnet publish Petapeta.csproj
          -c Release -r win-arm64 -p:Platform=arm64 -p:PlatformTarget=arm64 -p:EffectivePlatform=arm64
          -p:WindowsPackageType=None -p:SelfContained=true
          -o publish/arm64

      - name: Create ZIP archives
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path publish/x64/*   -DestinationPath "Petapeta-$tag-win-x64.zip"
          Compress-Archive -Path publish/arm64/* -DestinationPath "Petapeta-$tag-win-arm64.zip"
          # ZIP 版の自前更新(#12)がダウンロード後の検証に使う sha256sum 形式の
          # チェックサム。これが無いリリースは自前更新の対象外になる
          foreach ($zip in "Petapeta-$tag-win-x64.zip", "Petapeta-$tag-win-arm64.zip") {
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "$zip.sha256" -Value "$hash  $zip" -NoNewline
          }

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" \
              "Petapeta-${tag}-win-x64.zip" \
              "Petapeta-${tag}-win-x64.zip.sha256" \
              "Petapeta-${tag}-win-arm64.zip" \
              "Petapeta-${tag}-win-arm64.zip.sha256" \
              --clobber
          else
            gh release create "$tag" \
              "Petapeta-${tag}-win-x64.zip" \
              "Petapeta-${tag}-win-x64.zip.sha256" \
              "Petapeta-${tag}-win-arm64.zip" \
              "Petapeta-${tag}-win-arm64.zip.sha256" \
              --title "$tag" \
              --generate-notes
          fi

      # fork が upstream から遅れていると komac が CreateRef 権限エラーで失敗する
      # (権限エラーに見えるが実体は fork の同期ずれ。winget-releaser#319、#11)。
      # 毎回ここで fork を同期しておく。失敗しても公開自体は試みる。
      - name: Sync winget-pkgs fork
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          gh api -X POST repos/daruyanagi/winget-pkgs/merge-upstream \
            -f branch=master --jq '.message'

      - name: Publish to winget
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: daruyanagi.Petapeta
          installers-regex: \.zip$
          token: ${{ secrets.WINGET_TOKEN }}

name: CI

# push / PR でビルドとユニットテストを検証する(#23)。
# リリース(タグ)は release.yml が担当する。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # リリースと同じアンパッケージド構成で x64 のみ検証する(arm64 はリリース時に判明する)
      - name: Build app (x64)
        run: >
          dotnet build Petapeta.csproj
          -c Release -p:Platform=x64 -p:EffectivePlatform=x64
          -p:WindowsPackageType=None

      - name: Run unit tests
        run: dotnet test Petapeta.Tests/Petapeta.Tests.csproj -c Release
